services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codesurf
      POSTGRES_PASSWORD: codesurf
      POSTGRES_DB: codesurf
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - codesurf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesurf"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  codesurf_data:
