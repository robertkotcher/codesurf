<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Shop</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #f6f4ef; color: #222; margin: 0; }
  main { max-width: 420px; margin: 60px auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 2px 12px #0001; }
  h1 { margin: 0 0 18px; font-size: 22px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .item input { width: 60px; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 14px; }
  input, select { box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  select { width: 100%; }
  button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #2f6f4f; color: #fff; font: 600 16px system-ui; cursor: pointer; }
  #result { margin-top: 16px; min-height: 24px; font-weight: 600; }
  #result.error { color: #b3261e; }
  #result.paid { color: #2f6f4f; }
</style>
</head>
<body>
<main>
  <h1>Your cart</h1>
  <div class="item"><span>Coffee × <input id="coffee" type="number" min="0" value="2" aria-label="Coffee quantity"></span><span>$5.00</span></div>
  <div class="item"><span>Tea × <input id="tea" type="number" min="0" value="1" aria-label="Tea quantity"></span><span>$3.50</span></div>
  <label for="card">Card</label>
  <select id="card">
    <option value="demo-approved">Demo card (approved)</option>
    <option value="demo-declined">Demo card (declined)</option>
  </select>
  <button id="pay">Pay now</button>
  <p id="result" role="status"></p>
</main>
<script src="/cart.js"></script>
</body>
</html>
