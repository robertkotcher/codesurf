<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CodeSurf</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26392f;background:white}aside{width:220px;height:100vh;background:#f6f8f6;border-right:1px solid #dce5df;padding:20px 10px;overflow-y:auto}h1{display:flex;align-items:center;gap:9px;font-size:17px;margin:0 10px 22px}h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7d8b82;margin:0 10px 10px}.run{display:flex;align-items:start;border:1px solid transparent;border-radius:7px;margin:5px 0}.run.active{background:white;border-color:#c5d8cb}.select{flex:1;min-width:0;text-align:left;padding:10px;background:none;border:0;color:inherit;cursor:pointer}.title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.question{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#7d8b82;font-size:11px;margin-top:4px}.close{border:0;background:none;color:#7d8b82;font-size:18px;cursor:pointer;padding:6px}.close:hover{color:#26392f}#empty{position:absolute;left:250px;top:40px;color:#7d8b82}
</style></head><body><aside><h1><svg width="28" height="28" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path d="M5 12C12 5 20 19 27 12M5 21C12 14 20 28 27 21" stroke="#7465cb" stroke-width="4" stroke-linecap="round"/></svg><span>CodeSurf</span></h1><h2>Runs</h2><nav id="runs" aria-label="Runs"></nav></aside><p id="empty">Run codesurf with a repository and a question to open a map.</p><script>
window.runs.onChange(state=>{
const nav=document.getElementById('runs');nav.replaceChildren();document.getElementById('empty').hidden=state.runs.length>0;
for(const run of state.runs){const row=document.createElement('div');row.className='run'+(run.id===state.active?' active':'');const select=document.createElement('button');select.className='select';select.setAttribute('aria-pressed',String(run.id===state.active));select.onclick=()=>window.runs.select(run.id);const title=document.createElement('span');title.className='title';title.textContent=run.title;select.append(title);if(run.question!==run.title){const q=document.createElement('span');q.className='question';q.textContent=run.question;select.append(q);}select.title=run.question;const close=document.createElement('button');close.className='close';close.textContent='×';close.setAttribute('aria-label','Close '+run.title);close.onclick=()=>window.runs.close(run.id);row.append(select,close);nav.append(row);}
});window.runs.ready();
</script></body></html>
