<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository files · CodeSurf</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/canvas.css"><link rel="stylesheet" href="/files.css"></head>
<body class="files-page">
<header class="files-header">
 <a class="brand" href="/" aria-label="CodeSurf home"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none"><path d="M5 12C12 5 20 19 27 12M5 21C12 14 20 28 27 21" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg><span>CodeSurf<span class="brand-io">.io</span></span></a>
 <div class="files-pr"><span id="repositoryName">Repository files</span><b id="pullTitle"></b></div>
 <a class="button" id="returnReview">Back to review</a>
</header>
<main class="files-layout">
 <aside class="files-sidebar" id="filesSidebar" aria-label="Repository files">
  <div class="files-sidebar-heading"><h1>Repository</h1><select id="sourceSide" disabled aria-label="Repository version"><option value="head">After PR</option><option value="base">Before PR</option></select></div>
  <p class="files-scope">All files at this commit</p>
  <form id="pathForm"><input id="pathInput" disabled type="text" aria-label="Open a file by path" placeholder="Open file by path…" autocomplete="off"><button class="icon-button" aria-label="Open file" id="openPath" disabled></button></form>
  <nav id="fileTree" aria-label="Files and folders"></nav>
 </aside>
 <section class="file-viewer" aria-label="File contents">
  <div class="file-toolbar"><button id="toggleTree" class="icon-button" aria-label="Hide file browser" aria-expanded="true" aria-controls="filesSidebar"></button><nav id="breadcrumbs" aria-label="File path"></nav><button id="wrapFile" class="icon-button" aria-label="Wrap code lines" title="Wrap code lines" aria-pressed="false"></button></div>
  <div id="fileContent" class="file-content"><div class="file-state" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading repository…</p></div></div>
  <footer class="file-footer"><span id="filePath">Select a file to explore</span><span id="fileDetails"></span></footer>
 </section>
</main>
<script type="module" src="/files-app.js"></script>
</body></html>
